name: Selenium Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2

      - name: Limpar relatórios anteriores
        run: rm -rf allure-results allure-report

      - name: Executar testes Smoke
        run: mvn clean test -Denv=qa -Dcucumber.filter.tags="@smoke"

      - name: Validar geração do allure-results
        run: |
          if [ ! -d "allure-results" ]; then
            echo "A pasta allure-results não foi gerada."
            exit 1
          fi

          if [ -z "$(ls -A allure-results)" ]; then
            echo "A pasta allure-results está vazia."
            exit 1
          fi

          echo "allure-results gerado com sucesso."

      - name: Instalar Allure CLI
        run: npm install -g allure-commandline --save-dev

      - name: Gerar relatório Allure
        run: allure generate allure-results --clean -o allure-report

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Publicar relatório no GitHub Pages
        uses: actions/deploy-pages@v4